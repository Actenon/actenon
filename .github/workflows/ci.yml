name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the protocol package first so the kernel's pyproject
          # constraint `actenon-protocol>=1.1.0,<2` resolves cleanly.
          python -m pip install "actenon-protocol>=1.1.0,<2"
          python -m pip install -e ".[asymmetric,dev]"
          python -m pip install fastapi httpx

      - name: Compile package and examples
        run: |
          python -m compileall actenon examples

      - name: Run demo
        run: make demo

      - name: Run full test suite
        # The full test suite (561+ tests) runs on every supported Python
        # version, not just one. Previously only a narrow subset ran in CI;
        # Fable 5's Part 3A flagged this as a drift between docs and reality.
        run: python -m pytest tests/ -q

      - name: Run conformance suite
        # The conformance suite MUST run on every push and PR, not just on
        # conformance-v* tags. This is the public compatibility gate.
        run: python -m pytest tests/conformance/ -q

      # Claim-verification steps moved to verify-claims.yml (one copy of
      # each check; the README badge links there).

  typescript-verifier:
    name: TypeScript verifier SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        # The test files use node:test (not bun:test), so we must use
        # `npm test` (which runs `node --import tsx --test`) rather than
        # `bun test` (which doesn't support nested node:test calls).
        run: npm test

  go-verifier:
    name: Go verifier SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: sdk/go/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

  rust-verifier:
    name: Rust verifier SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'stable'
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test --verbose

  # The verify-claims job moved to verify-claims.yml so the README
  # badge can link to a dedicated gate.
